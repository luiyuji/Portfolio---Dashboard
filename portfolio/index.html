<!DOCTYPE html>
<html>
<head>
    <title>Landing Page</title>

    <style>
        body {
            font-family: "Roboto", sans-serif;
            margin: 0;
            background: linear-gradient(135deg, lightblue, white);
        }

        /* NAVBAR */
        nav {
            background: rgba(0,0,0,0.8);
            padding: 20px 0;
            text-align: center;
        }

        nav a {
          
            background: rgba(255,255,255,0.1);
            color: white;

            padding: 12px 18px;
            margin: 8px;

            transition: 0.3s ease;
            border: 1px solid transparent;
        }

        nav a:hover {
            background: skyblue;
            color: black;
            transform: scale(1.1);
            border: 1px solid skyblue;
            box-shadow: 0 0 15px skyblue;
        }

        /* MAIN CONTAINER */
        .container {
            text-align: center;
            margin-top: 120px;
            color: skyblue;
        }

        .container h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .container p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* CARD */
        .card {
            background: rgba(255,255,255,0.95);
            width: 300px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            color: skyblue;

            transition: 0.3s;
        }

        /* CARD HOVER */
        .card:hover {
            transform: translateY(-8px);
        }

        /* BUTTON */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            background: black;
            color: skyblue;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: skyblue;
            color: black;
            transform: scale(1.05);
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="quiz.html">Quizzes</a>
        <a href="laboratory.html">Laboratory</a>
        <a href="exam.html">Exam</a>
    </nav>

    <!-- CONTENT -->
    <div class="container">
        <h1>My Portfolio</h1>
        <p>Welcome to my portfolio</p>

        <div class="card">
            <h2>Profile Page</h2>
            <p>View my personal information</p>

            <a href="profile.html">
                <button class="btn">Go to Profile</button>
            </a>
        </div>
    </div>

</body>
</html>
