<!DOCTYPE html>
<html>
<head>
    <title>QUIZZES</title>
    <style>
        body {
            font-family: "Roboto", sans-serif;
            margin: 0;
            background: linear-gradient(135deg, lightblue, white);
        }

                /* NAVBAR */
        nav {
            background: rgba(0,0,0,0.8);
            padding: 20px 0;
            text-align: center;
        }

        nav a {
          
            background: rgba(255,255,255,0.1);
            color: white;

            padding: 12px 18px;
            margin: 8px;

            transition: 0.3s ease;
            border: 1px solid transparent;
        }

        nav a:hover {
            background: skyblue;
            color: black;
            transform: scale(1.1);
            border: 1px solid skyblue;
            box-shadow: 0 0 15px skyblue;
        }

        /* TITLE */
        h2 {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 40px;
        }

        /* GRID */
        .grid {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 50px;
            flex-wrap: wrap;
        }

        /* BOX */
        .box {
            width: 340px;
            height: 340px;
            background: 
            rgba(255,255,255,0.95);
            box-shadow: 0 10px 25px white (0,0,0,0.25);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            border: 20px solid transparent;
        }
        .box span {
            font-size: 13px;
            margin-top: 8px;
            opacity: 0.7;
        }

        .box::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: gradient(120deg, transparent, white);
            top: 0%;
            left:0%;
            transition: 0.5s;
        }

        .box:hover::before {
            left:0%;
        }

        .box:hover {
            background: white;
            color: white;
        }

    </style>
</head>
<body>
